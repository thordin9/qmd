version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: qmd-postgres-test
    environment:
      POSTGRES_DB: qmd
      POSTGRES_USER: qmd_user
      POSTGRES_PASSWORD: qmd_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qmd_user -d qmd"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
